# Forge — build + sign the MSI installer (SignPath OSS = free code signing for open source).
# Target: winget install Forge.Forge — needs the signed MSI attached to a GitHub Release,
# then the winget manifest (winget/) submitted to microsoft/winget-pkgs.
#
# The add-in builds on a clean runner because the SolidWorks interop assemblies are committed in
# lib/sw-interop (produced by installer/fetch-interop.ps1 on a SolidWorks machine) and the csproj
# resolves them via -p:SwInteropRoot. Remaining gate to FULLY live: SignPath OSS account + secrets.
#
# Until signing secrets exist, this workflow builds the MSI and uploads it as an artifact; the sign
# step reports a clear setup message instead of failing silently. The MSI is attached to a release
# ONLY by the sign-msi job (after signing) — never attach the unsigned MSI, or the winget package
# would point at an asset Smart App Control blocks.

name: Build & sign MSI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify SolidWorks interop (lib/sw-interop)
        run: |
          $interop = Join-Path $env:GITHUB_WORKSPACE 'lib\sw-interop'
          $need = @('SolidWorks.Interop.sldworks.dll','SolidWorks.Interop.swconst.dll','SolidWorks.Interop.swpublished.dll')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $interop $_)) }
          if ($missing) {
            Write-Host "Missing interop DLLs: $($missing -join ', ')"
            Write-Host 'Run installer/fetch-interop.ps1 on a SolidWorks machine and commit lib/sw-interop.'
            exit 1
          }

      - name: Build add-in (Release x64)
        run: dotnet build solidworks/Forge.SolidWorks.csproj -c Release -p:Platform=x64 -p:SwInteropRoot="$env:GITHUB_WORKSPACE\lib\sw-interop"

      - name: Build MSI
        run: powershell -ExecutionPolicy Bypass -File installer/build-msi.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-msi
          path: dist/*.msi

  # SignPath OSS (https://www.signpath.io/oss) — free, real cert, Smart App Control trusts the result.
  # Setup checklist (Ravi):
  #   1. Make the repo public; sign in to SignPath OSS with the org account (github app approval).
  #   2. Create the project for this repo; grant a service account "signing" on the project.
  #   3. Paste SignPath's generated workflow step here — the dashboard generates the exact API call
  #      (their docs: https://docs.signpath.io/Integrations/GitHub). Do NOT hand-write the endpoint.
  #   4. Add the repo secrets the generated step needs (SignPath API token + org/project/policy ids).
  # The MSI must be embedded-single-file and x64 — installer/Product.wxs already does that.
  sign-msi:
    needs: build-msi
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: forge-msi
          path: dist

      - name: Check SignPath secrets are configured
        run: |
          if ("${{ secrets.SIGNPATH_API_TOKEN }}" -eq "") {
            Write-Host "SignPath OSS secrets not configured yet. Add SIGNPATH_API_TOKEN + the"
            Write-Host "SIGNPATH_ORG_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_SIGNING_POLICY_SLUG"
            Write-Host "secrets (values from the SignPath OSS dashboard) and paste the generated"
            Write-Host "signing-request step from https://docs.signpath.io/Integrations/GitHub."
            exit 1
          }

      # PLACEHOLDER — replace with SignPath's generated signing step once secrets exist.
      # It submits a signing request for the downloaded dist\*.msi and downloads the signed MSI
      # back into dist\. Then the attach step below publishes ONLY that signed MSI as the release
      # asset (winget requires the signed binary; never ship the unsigned one).

      - name: Attach SIGNED MSI to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi

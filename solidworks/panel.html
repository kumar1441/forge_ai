<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forge</title>
<style>
  :root {
    /* FDL v1 dark (default) — docs/ui-design-system.md §2 */
    --bg:#0B0D12;        /* panel background */
    --surface:#12151C;   /* cards */
    --raised:#181C26;    /* composer, hover states, user bubble */
    --ink:#F1F3F5;       /* primary text */
    --soft:rgba(241,243,245,.55);
    --faint:rgba(241,243,245,.32);
    --line:rgba(241,243,245,.08);

    --ember1:#FC9165; --ember2:#F47840;
    --accent:#F47840;
    --accent-ink:#FFB08A;
    --accent-soft:rgba(244,120,64,.14);

    --mint:#7ED3A0;  --mint-soft:rgba(126,211,160,.10);
    --amber:#F5C169; --amber-soft:rgba(245,193,105,.10);
    --red:#F27D72;   --red-soft:rgba(242,125,114,.10);
    --sky:#7AA5FF;   --sky-soft:rgba(122,165,255,.12);
    --violet:#B794F6;--violet-soft:rgba(183,148,246,.12);
  }
  /* FDL v1 light (override only — tools that force it) */
  [data-theme="light"] {
    --bg:#FFFFFF; --surface:#FFFFFF; --raised:#F6F7F9;
    --ink:#1B1F24; --soft:rgba(27,31,36,.62); --faint:rgba(27,31,36,.38);
    --line:rgba(27,31,36,.10); --accent-ink:#B34516;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* header */
  .head { padding:14px 18px 10px; border-bottom:1px solid var(--line); }
  .headtop { display:flex; align-items:center; justify-content:space-between; }
  .clearbtn { background:var(--raised); border:1px solid var(--line); border-radius:8px; color:var(--faint);
    font:inherit; font-size:11px; padding:2px 9px; cursor:pointer; }
  .clearbtn:hover { border-color:var(--accent); color:var(--ink); }
  .brand { font-size:13px; letter-spacing:.3px; color:var(--faint); }
  .brand b { color:var(--ink); font-weight:600; }
  .brand b span { color:var(--accent); }
  .know { margin-top:5px; font-size:12px; color:var(--soft); min-height:16px; }
  .know .part { color:var(--ink); font-weight:600; }
  .know .dot { color:var(--accent); }

  /* scrollable transcript */
  .transcript { flex:1; overflow-y:auto; padding:16px 16px 8px; display:flex; flex-direction:column; gap:16px; }

  /* empty state */
  .empty { margin:auto; text-align:center; font-size:12.5px; color:var(--faint); line-height:1.9; }
  .empty b { color:var(--soft); font-weight:600; }

  .turn { display:flex; flex-direction:column; gap:8px; }
  .bubble.user {
    align-self:flex-end; max-width:88%; background:var(--raised);
    border:1px solid var(--line); border-radius:14px 14px 4px 14px;
    padding:9px 13px; font-size:13.5px; white-space:pre-wrap; word-break:break-word;
  }
  .forge { display:flex; flex-direction:column; gap:6px; }

  /* the named-crew step lines — the honest machinery */
  .steps { display:flex; flex-direction:column; gap:4px; }
  .step { font-size:12.5px; color:var(--soft); display:flex; align-items:baseline; gap:7px; }
  .step .agent { font-weight:600; color:var(--accent-ink); }
  .step .glyph { font-size:11px; width:12px; text-align:center; flex:none; }
  .step.run .glyph { color:var(--accent); animation:pulse 1s ease-in-out infinite; }
  .step.done .glyph { color:var(--mint); }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* cycling mechanical gerund — the "thinking" word */
  .thinking { font-size:12.5px; color:var(--soft); display:flex; align-items:center; gap:8px; min-height:18px; }
  .thinking .tdot { color:var(--accent); animation:pulse 1s ease-in-out infinite; font-size:9px; }
  .thinking .tword { font-weight:600; color:var(--ink); }

  .result { display:flex; flex-direction:column; gap:8px; }

  .card {
    border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    background:var(--surface); display:flex; flex-direction:column; gap:3px;
  }
  .card.ok { background:var(--mint-soft); border-color:rgba(126,211,160,.30); }
  .card.fail { background:var(--red-soft); border-color:rgba(242,125,114,.30); }
  .card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card .name { font-weight:600; }
  .card .sub { font-size:11.5px; color:var(--soft); word-break:break-word; }
  .card .answer { font-size:15px; color:var(--ink); }
  .card .fb { margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .card .fb button { background:none; border:1px solid var(--line,#d0d0d0); border-radius:6px; cursor:pointer; font-size:13px; padding:2px 8px; opacity:.7; }
  .card .fb button:hover { opacity:1; }
  .card .fb .reasons { display:inline-flex; gap:4px; }
  .card .fb .reasons button { font-size:11px; }
  .card .fb .fbthx2 { font-size:12px; opacity:.6; }
  .tag { font-size:10.5px; padding:2px 8px; border-radius:20px; background:var(--mint-soft); color:var(--mint); border:1px solid rgba(126,211,160,.30); white-space:nowrap; }
  .card.fail .tag { background:var(--red-soft); color:var(--red); border-color:rgba(242,125,114,.30); }
  .card.review { background:var(--amber-soft); border-color:rgba(245,193,105,.30); }
  .card.review .tag { background:var(--amber-soft); color:var(--amber); border-color:rgba(245,193,105,.30); }
  .card.bifrost { background:var(--sky-soft); border-color:rgba(122,165,255,.30); }
  .card.team { background:var(--violet-soft); border-color:rgba(183,148,246,.30); }
  .card.team .tag { background:var(--violet-soft); color:var(--violet); border-color:rgba(183,148,246,.30); }

  /* FDL 4.4 ConfirmGate — the trust component (ember left border) */
  .gate { border-left:2px solid var(--accent); }
  .gate.permanent .name { color:var(--red); }
  .gate .rows { display:flex; flex-direction:column; gap:3px; margin:4px 0 2px; }
  .gate .row { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--soft); }
  .gate .row b { color:var(--ink); font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-weight:600; }
  .gate .excl { font-size:11.5px; color:var(--faint); }
  .gate .files { font-size:11.5px; color:var(--faint); font-family:ui-monospace,"Cascadia Code",Consolas,monospace; }
  .gate .acts { display:flex; gap:8px; margin-top:8px; }
  .gate .acts button { font:inherit; font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; cursor:pointer; border:none; }
  .gate .go { background:linear-gradient(135deg,var(--ember1),var(--ember2)); color:#0B0D12; box-shadow:0 4px 24px rgba(252,145,101,.35); }
  .gate .nope { background:none; border:1px solid var(--line) !important; color:var(--soft); }
  .gate .gfoot { margin-top:6px; font-size:11px; color:var(--faint); }

  /* FDL 4.5 BucketReport — three hue-coded rows */
  .report .bucket { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .report .bucket:last-child { border-bottom:none; }
  .report .bucket .n { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-weight:600; min-width:22px; text-align:right; }
  .report .bucket.ok .n { color:var(--mint); }
  .report .bucket.review .n { color:var(--amber); }
  .report .bucket.fail .n { color:var(--red); }
  .report .bucket .t { color:var(--soft); }
  .report .bucket.fail .t b { color:var(--red); font-weight:600; }
  .report .bucket .names { color:var(--faint); font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:11.5px; margin-left:auto; text-align:right; }

  /* FDL 4.7 ShareLink — the Drop card */
  .share .link { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:11.5px; color:var(--sky);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .share .stats { display:flex; gap:12px; font-size:11.5px; color:var(--faint); margin-top:6px; }
  .share .stats b { color:var(--mint); font-weight:600; }
  .share .mini { background:none; border:1px solid var(--line); border-radius:8px; color:var(--soft); font:inherit;
    font-size:11.5px; padding:2px 8px; cursor:pointer; }
  .share .mini:hover { border-color:var(--accent); color:var(--ink); }

  /* FDL 4.9 PresenceRow — avatar dots in the header */
  .presence { display:flex; align-items:center; gap:2px; }
  .avatar { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:600; color:#0B0D12; background:linear-gradient(135deg,var(--ember1),var(--ember2));
    border:2px solid var(--bg); margin-left:-4px; }
  .avatar.editing { border-color:var(--violet); }
  .avatar.more { background:var(--raised); color:var(--soft); border:1px solid var(--line); }

  /* FDL 3-page onboarding overlay (trap.md: welcome+key / trust / try-it) */
  .onboard { position:absolute; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:28px; }
  .onboard .obdiamond { font-size:26px; color:var(--accent); }
  .onboard h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:.3px; }
  .onboard .obsub { font-size:13.5px; color:var(--soft); text-align:center; max-width:300px; line-height:1.6; }
  .onboard .obpill { font:inherit; font-size:13.5px; font-weight:600; padding:10px 22px; border-radius:999px;
    background:linear-gradient(135deg,var(--ember1),var(--ember2)); color:#0B0D12; cursor:pointer; border:none;
    box-shadow:0 4px 24px rgba(252,145,101,.35); }
  .onboard .obghost { background:none; border:1px solid var(--line); color:var(--soft); }
  .onboard .obkey { width:100%; max-width:300px; background:var(--raised); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; font:inherit; font-size:13px; color:var(--ink); outline:none; }
  .onboard .obkey:focus { border-color:var(--accent); }
  .onboard .obskip { position:absolute; top:14px; right:16px; background:none; border:none; color:var(--faint);
    font:inherit; font-size:12px; cursor:pointer; }
  .onboard .obtrust { text-align:left; max-width:320px; display:flex; flex-direction:column; gap:10px; }
  .onboard .obtrust div { display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--soft); }
  .onboard .obtrust .glyph2 { color:var(--mint); flex:none; }
  .onboard .obdots { display:flex; gap:6px; margin-top:6px; }
  .onboard .obdot { width:7px; height:7px; border-radius:50%; background:var(--raised); border:1px solid var(--line); }
  .onboard .obdot.on { background:var(--accent); border-color:var(--accent); }
  .card.bifrost .tag { background:var(--sky-soft); color:var(--sky); border-color:rgba(122,165,255,.30); }
  .done { font-size:13px; color:var(--mint); font-weight:600; }
  .err  { font-size:13px; color:var(--red); }

  /* composer pinned to the bottom */
  .composer { border-top:1px solid var(--line); padding:12px 14px 8px; background:var(--bg); }
  .ask { position:relative; }
  textarea {
    width:100%; resize:none; overflow:hidden; min-height:48px; max-height:160px;
    background:var(--raised); border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; font:inherit; color:var(--ink); outline:none;
    transition:border-color .15s, background .15s;
  }
  textarea::placeholder { color:var(--faint); }
  textarea:focus { border-color:var(--accent); background:var(--raised); }
  .hint { margin:7px 2px 0; font-size:11px; color:var(--faint); }
  .hint kbd { background:var(--raised); border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:10.5px; }

  /* attach affordance — hand Forge a file (e.g. the other version) without typing a path */
  .attachrow { display:flex; align-items:center; gap:8px; margin:0 2px 8px; flex-wrap:wrap; }
  .attachbtn { background:var(--raised); border:1px solid var(--line); border-radius:9px; padding:4px 10px;
    cursor:pointer; font:inherit; font-size:12px; color:var(--soft); }
  .attachbtn:hover { border-color:var(--accent); color:var(--ink); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--amber-soft); border:1px solid rgba(245,193,105,.30);
    border-radius:9px; padding:3px 6px 3px 9px; font-size:11.5px; color:var(--accent-ink); }
  .chip .x { cursor:pointer; border:none; background:none; color:var(--accent-ink); font-size:13px; padding:0 2px; opacity:.7; }
  .chip .x:hover { opacity:1; }

  /* slim trial feedback footer */
  .fb { margin-top:8px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11.5px; color:var(--faint); }
  .fbbtn { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:1px 7px; cursor:pointer; font-size:13px; }
  .fbbtn:hover { border-color:var(--accent); }
  .fbtxt { flex:1; min-width:110px; background:var(--raised); border:1px solid var(--line); border-radius:8px;
    padding:5px 8px; font:inherit; font-size:11.5px; color:var(--ink); outline:none; }
  .fbthx { color:var(--mint); font-weight:600; }

  /* header right cluster: settings + clear */
  .headacts { display:flex; align-items:center; gap:8px; }
  .gear { background:var(--raised); border:1px solid var(--line); border-radius:8px; color:var(--soft);
    font:inherit; font-size:14px; padding:1px 9px; cursor:pointer; line-height:1.4; }
  .gear:hover { border-color:var(--accent); color:var(--ink); }

  /* settings popover */
  .settings { position:absolute; top:52px; right:14px; z-index:60; width:230px;
    background:var(--raised); border:1px solid var(--line); border-radius:12px;
    padding:10px; display:flex; flex-direction:column; gap:4px; }
  .settings .srow { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 6px; font-size:12.5px; color:var(--ink); }
  .settings .srow label { color:var(--soft); }
  .settings .ssep { border-top:1px solid var(--line); margin:4px 0; }
  .toggle { position:relative; width:38px; height:22px; flex:none; cursor:pointer; }
  .toggle input { opacity:0; width:0; height:0; }
  .toggle .tk { position:absolute; inset:0; background:var(--raised); border:1px solid var(--line); border-radius:999px; transition:background .18s; }
  .toggle .tk::after { content:""; position:absolute; left:3px; top:2px; width:16px; height:16px; border-radius:50%; background:var(--soft); transition:transform .18s, background .18s; }
  .toggle input:checked + .tk { background:var(--accent-soft); border-color:var(--accent); }
  .toggle input:checked + .tk::after { transform:translateX(16px); background:var(--accent); }
  .settings .sclose { background:none; border:none; color:var(--faint); font:inherit; font-size:11.5px;
    text-align:right; cursor:pointer; padding:4px 6px 0; }
  .settings .sclose:hover { color:var(--ink); }
  .settings .sfoot { font-size:10.5px; color:var(--faint); padding:2px 6px 4px; }
</style>
</head>
<body>
  <div class="head">
    <div class="headtop" id="headtop">
      <div class="brand"><b><span>◆</span> Forge</b></div>
      <div class="headacts">
        <button class="gear" id="gearbtn" title="Settings">⚙</button>
        <button class="clearbtn" id="clearbtn" title="Clear the panel for a fresh recording take">Clear</button>
      </div>
    </div>
    <div class="know" id="know">Looking for your part…</div>
    <div class="settings" id="settings" style="display:none">
      <button class="sclose" id="sclose">✕</button>
      <div class="srow"><label>Dark theme</label>
        <span class="toggle"><input type="checkbox" id="themetgl" /><span class="tk"></span></span>
      </div>
      <div class="ssep"></div>
      <div class="srow"><label>Provider</label><span style="color:var(--faint);font-size:11.5px">BYOK · see README</span></div>
      <div class="srow"><label>Telemetry</label><span style="color:var(--faint);font-size:11.5px">anonymous · on</span></div>
      <div class="sfoot">settings pane — more controls coming with the signed installer</div>
    </div>
  </div>

  <div class="transcript" id="transcript">
    <div class="empty" id="empty">
      Forge <b>knows</b> your part.<br>
      Forge <b>understands</b> what you mean.<br>
      Forge <b>gets it done.</b>
    </div>
  </div>

  <div class="composer">
    <div class="attachrow">
      <button class="attachbtn" id="attach" title="Attach a file — e.g. the other version to compare against">📎 Attach a file</button>
      <span class="chip" id="chip" style="display:none"></span>
    </div>
    <div class="ask">
      <textarea id="intent" rows="1"></textarea>
      <div class="hint"><kbd>Enter</kbd> to run · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div>
    </div>
    <div class="fb" id="fb">
      <span>Useful so far?</span>
      <button class="fbbtn" id="fbup" title="Yes">👍</button>
      <button class="fbbtn" id="fbdown" title="Not really">👎</button>
      <input class="fbtxt" id="fbtxt" placeholder="tell Ravi more (optional)" />
      <span class="fbthx" id="fbthx"></span>
    </div>
  </div>

<script>
  const hasBridge = !!(window.chrome && window.chrome.webview);
  const post = (o) => { if (hasBridge) window.chrome.webview.postMessage(JSON.stringify(o)); };
  const $ = (id) => document.getElementById(id);
  const transcript = $("transcript");
  const intent = $("intent");

  // rotating mechanical "thinking" words — one shared pool
  const WORDS = ["Mating","Fastening","Threading","Torquing","Bolting","Calibrating",
    "Aligning","Meshing","Tightening","Riveting","Forging","Combobulating",
    "Ratcheting","Whirring","Clanking","Cranking","Sprocketing","Kerchunking"];

  const grow = () => { intent.style.height = "auto"; intent.style.height = Math.min(intent.scrollHeight,160) + "px"; };
  intent.addEventListener("input", grow);

  function refresh() { post({ action: "readModel" }); }
  window.addEventListener("DOMContentLoaded", refresh);

  // Clear the panel for a fresh recording take: wipe the transcript + reset Forge's pending threads.
  function clearPanel() {
    stopWords();
    working = false; turn = null;
    transcript.innerHTML = '<div class="empty" id="empty">Forge <b>knows</b> your part.<br>' +
      'Forge <b>understands</b> what you mean.<br>Forge <b>gets it done.</b></div>';
    hideChip();
    intent.value = ""; grow();
    post({ action: "reset" });
    intent.focus();
  }
  $("clearbtn").addEventListener("click", clearPanel);

  // ---- settings: gear open/close + theme toggle (persists; default = follow OS) ----
  const settingsEl = $("settings"), themeTgl = $("themetgl");
  function applyTheme() {
    const saved = localStorage.getItem("forge_theme");            // "dark" | "light" | null = follow OS
    const osLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    const dark = saved ? saved !== "light" : !osLight;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    themeTgl.checked = saved === "dark" || (!saved && !osLight);
  }
  $("gearbtn").addEventListener("click", (e) => { e.stopPropagation(); settingsEl.style.display = settingsEl.style.display === "none" ? "flex" : "none"; });
  $("sclose").addEventListener("click", () => settingsEl.style.display = "none");
  document.addEventListener("click", (e) => { if (!e.target.closest("#settings") && !e.target.closest("#gearbtn")) settingsEl.style.display = "none"; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") settingsEl.style.display = "none"; });
  themeTgl.addEventListener("change", () => { localStorage.setItem("forge_theme", themeTgl.checked ? "dark" : "light"); applyTheme(); });
  applyTheme();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  intent.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const text = intent.value.trim();
      if (text) run(text);
    }
  });

  let working = false;
  let turn = null;          // { steps, thinking, result } DOM refs for the active Forge turn
  let wordTimer = null;

  function nearBottom() { return transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 60; }
  function scroll() { transcript.scrollTop = transcript.scrollHeight; }

  function run(text) {
    if (working) return;
    working = true;
    const e = $("empty"); if (e) e.remove();

    // user bubble
    const t = document.createElement("div");
    t.className = "turn";
    const u = document.createElement("div");
    u.className = "bubble user"; u.textContent = text;
    const f = document.createElement("div"); f.className = "forge";
    const steps = document.createElement("div"); steps.className = "steps";
    const thinking = document.createElement("div"); thinking.className = "thinking";
    thinking.innerHTML = `<span class="tdot">●</span><span class="tword">${WORDS[0]}…</span>`;
    const result = document.createElement("div"); result.className = "result";
    f.append(steps, thinking, result);
    t.append(u, f);
    transcript.append(t);
    turn = { steps, thinking, result, tword: thinking.querySelector(".tword") };
    scroll();
    startWords();

    // CLEAR the input — like any chat
    intent.value = ""; grow();

    post({ action: "generate", intent: text });
    if (!hasBridge) demoRun(text);   // standalone browser preview
  }

  function startWords() {
    let i = 0;
    stopWords();
    wordTimer = setInterval(() => {
      i = Math.floor(Math.random() * WORDS.length);
      if (turn) turn.tword.textContent = WORDS[i] + "…";
    }, 850);
  }
  function stopWords() { if (wordTimer) { clearInterval(wordTimer); wordTimer = null; } }

  // a named-crew step line — running, then resolved
  function stepLine(agent, gloss, state, result) {
    if (!turn) return;
    let el = agent ? turn.steps.querySelector(`[data-agent="${agent}"]`) : null;
    const wasBottom = nearBottom();
    if (!el) {
      el = document.createElement("div");
      if (agent) el.dataset.agent = agent;
      turn.steps.append(el);
    }
    if (state === "done") {
      el.className = "step done";
      el.innerHTML = `<span class="glyph">✓</span><span>${agent ? `<span class="agent">${agent}</span> · ` : ""}${(result || gloss || "").replace(/</g,"&lt;")}</span>`;
    } else {
      el.className = "step run";
      el.innerHTML = `<span class="glyph">◆</span><span>${agent ? `Deploying <span class="agent">${agent}</span> · ` : ""}${(gloss || "").replace(/</g,"&lt;")}</span>`;
    }
    if (wasBottom) scroll();
  }

  // finish the turn: stop the gerund, drop the thinking line, render the result card(s)
  function finish(html) {
    stopWords();
    if (turn) {
      turn.thinking.remove();
      if (html) turn.result.innerHTML = html;
    }
    working = false; turn = null;
    scroll();
  }

  function renderRedWave(m) {
    const clean = m.clean;
    const title = m.removed > 0 ? `Removed ${m.removed} conflicting mate${m.removed===1?"":"s"}` : "Checked the mates";
    return `<div class="card ${clean ? "ok" : "review"}">
      <div class="top"><span class="name">${title}</span><span class="tag">${clean ? "fixed" : "review"}</span></div>
      <div class="sub">${(m.info||"").replace(/</g,"&lt;")}</div></div>`;
  }

  // FDL 4.4 ConfirmGate — counts, exclusions, new files, [Forge it]/[Not yet]
  function renderConfirm(m) {
    const rows = (m.counts || []).map(c => `<div class="row"><span>${c.label}</span><b>${c.value}</b></div>`).join("");
    const excl = (m.exclusions || []).length
      ? `<div class="excl">skipping ${m.exclusions.length} — ${m.exclusions.map(x=>String(x).replace(/</g,"&lt;")).join(", ")}</div>` : "";
    const files = (m.files || []).length
      ? `<div class="files">new: ${m.files.map(f=>String(f).replace(/</g,"&lt;")).join(" · ")}</div>` : "";
    const perm = m.permanent ? " permanent" : "";
    return `<div class="card gate${perm}">
      <div class="top"><span class="name">${String(m.name||"Confirm").replace(/</g,"&lt;")}</span><span class="tag review">${m.permanent ? "permanent" : "confirm"}</span></div>
      ${rows ? `<div class="rows">${rows}</div>` : ""}${excl}${files}
      <div class="acts"><button class="go" data-confirm="1">${m.permanent ? "Do it" : "Forge it"}</button>
      <button class="nope" data-confirm="0">Not yet</button></div>
      <div class="gfoot">say "revert" anytime after</div></div>`;
  }

  // FDL 4.5 BucketReport — clean / auto-fixed / need human (+ quarantined)
  function renderReport(m) {
    const b = (n, cls, label, names) => n > 0
      ? `<div class="bucket ${cls}"><span class="n">${n}</span><span class="t">${label}</span>${names ? `<span class="names">${names.map(x=>String(x).replace(/</g,"&lt;")).join(", ")}</span>` : ""}</div>` : "";
    return `<div class="card report">
      ${b(m.clean, "ok", "clean", null)}
      ${b(m.auto, "review", "auto-fixed", null)}
      ${b(m.human, "fail", "need human", m.humanNames)}
      ${b(m.quarantined, "fail", "quarantined", null)}
    </div>`;
  }

  // FDL 4.7 ShareLink — the Drop card
  function renderShare(m) {
    return `<div class="card share">
      <div class="top"><span class="name">${String(m.name||"File dropped").replace(/</g,"&lt;")}</span><span class="tag">done</span></div>
      <div class="link">${String(m.link||"").replace(/</g,"&lt;")}</div>
      <div class="top" style="margin-top:6px">
        <div class="sub">view link · expires in 7 days · ${m.downloads||0} downloads</div>
        <div><button class="mini" data-copy="1">copy</button><button class="mini" data-revoke="1">revoke</button></div>
      </div>
      <div class="stats"><span><b>${m.views||0}</b> views</span><span><b>${m.pulls||0}</b> pulls</span><span><b>${m.joined||0}</b> joined</span></div>
    </div>`;
  }

  function handle(m) {
    if (m.type === "model") {
      if (m.title) {
        const n = (m.dimensions || []).length;
        $("know").innerHTML = `<span class="dot">●</span> Working on <span class="part">${m.title}</span> — I see ${n} dimension${n===1?"":"s"} I can drive.`;
      } else {
        $("know").innerHTML = `Open a part and I'll get to work.`;
      }
    }

    else if (m.type === "step") { stepLine(m.agent, m.gloss, m.state, m.result); }
    else if (m.type === "status") { stepLine(null, m.message, "run"); }

    else if (m.type === "attached") { showChip(m.name); }
    else if (m.type === "attachCleared") { hideChip(); }

    else if (m.type === "error") {
      finish(`<div class="err">${(m.message || "").replace(/</g,"&lt;")}</div>`);
    }

    else if (m.type === "variants") { finish(renderVariants(m)); }

    else if (m.type === "impact") {
      finish(`<div class="card review">
        <div class="top"><span class="name">Impact analysis</span><span class="tag">review</span></div>
        <div class="sub" style="white-space:pre-wrap">${(m.explanation || "").replace(/</g,"&lt;")}</div>
      </div>`);
    }

    else if (m.type === "answer") {
      const thumbs = m.runId ? `<div class="fb" data-run="${m.runId}" data-handler="${m.handler||''}">
          <button class="tup" title="worked">👍</button><button class="tdn" title="not right">👎</button>
          <span class="reasons" style="display:none">
            <button data-r="wrong_parts">wrong parts</button><button data-r="too_much">did too much</button><button data-r="didnt_work">didn't work</button>
          </span></div>` : "";
      finish(`<div class="card"><div class="answer">${(m.answer || "").replace(/</g,"&lt;")}</div>${thumbs}</div>`);
    }

    else if (m.type === "clarify") {
      finish(`<div class="card">
        <div class="top"><span class="name">One quick question</span></div>
        <div class="sub">${(m.message || "").replace(/</g,"&lt;")}</div>
      </div>`);
    }

    else if (m.type === "edit") { finish(renderEdit(m)); }
    else if (m.type === "red_wave") { finish(renderRedWave(m)); }

    else if (m.type === "shared") {
      finish(`<div class="card ok"><div class="top"><span class="name">Shared with your team</span><span class="tag">done</span></div>
        <div class="sub">Pushed your version (${m.count} dimensions). Teammates will be offered to pull it.</div></div>`);
    }

    else if (m.type === "mated") {
      const proud = m.proud || 0, seated = (m.seated != null ? m.seated : m.count);
      const tail = m.failed ? `, ${m.failed} skipped` : "";
      const good = m.clean && proud === 0;
      const thumbs = m.runId ? `<div class="fb" data-run="${m.runId}" data-handler="${m.handler||''}">
          <button class="tup" title="worked">👍</button><button class="tdn" title="not right">👎</button>
          <span class="reasons" style="display:none">
            <button data-r="wrong_parts">wrong parts</button><button data-r="too_much">did too much</button><button data-r="didnt_work">didn't work</button>
          </span></div>` : "";
      finish(`<div class="card ${good ? "ok" : "review"}">
        <div class="top"><span class="name">Auto-mated ${m.count} fastener${m.count===1?"":"s"}${tail}</span><span class="tag">${good ? "done" : "review"}</span></div>
        <div class="sub">${
          proud > 0
            ? `${seated} seated flush · ${proud} aligned but didn't sit flush — worth a look.`
            : (m.clean ? "All seated flush — rebuild clean, nothing else moved." : "Mated, but a rebuild warning appeared — worth a look.")
        }</div>${thumbs}</div>`);
    }

    // FDL 4.4/4.5/4.7 — the batch-5 components (a type without a renderer is a bug)
    else if (m.type === "confirm") { finish(renderConfirm(m)); }
    else if (m.type === "report") { finish(renderReport(m)); }
    else if (m.type === "share") { finish(renderShare(m)); }
    else if (m.type === "presence") { renderPresence(m); }
    else if (m.type === "firstrun") { showOnboard(); }

    // cross-tool / teammate notifications arrive any time — append as a system card
    else if (m.type === "bifrost") {
      systemCard(`<div class="card bifrost">
        <div class="top"><span class="name">⚡ ${(m.source||"another tool")} changed the board</span><span class="tag">cross-tool</span></div>
        <div class="sub">${(m.summary||"").replace(/</g,"&lt;")}</div>
        <div class="sub" style="margin-top:4px">Ask: <i>"does this board change affect my part?"</i></div>
      </div>`);
    }
    else if (m.type === "incoming") {
      const lines = (m.diff || []).map(d => `<div class="sub">• ${String(d).replace(/</g,"&lt;")}</div>`).join("");
      systemCard(`<div class="card bifrost">
        <div class="top"><span class="name">👥 ${(m.summary||"A teammate shared a version").replace(/</g,"&lt;")}</span><span class="tag">team</span></div>
        ${lines}<div class="sub" style="margin-top:4px">Reply <b>"apply"</b> to update your model to match.</div>
      </div>`);
    }

    // safety net: any unhandled TERMINAL card must still stop the gerund + end the turn (never leave it looping)
    else if (working) { finish(m.info ? `<div class="card ok"><div class="sub">${String(m.info).replace(/</g,"&lt;")}</div></div>` : ""); }
  }

  function systemCard(html) {
    const e = $("empty"); if (e) e.remove();
    const wasBottom = nearBottom();
    const t = document.createElement("div"); t.className = "turn"; t.innerHTML = html;
    transcript.append(t);
    if (wasBottom) scroll();
  }

  // FDL 4.9 PresenceRow — avatar dots in the header
  function renderPresence(m) {
    let host = document.querySelector(".presence");
    if (!host) {
      host = document.createElement("div"); host.className = "presence";
      $("headtop").appendChild(host);
    }
    const people = (m.people || []).slice(0, 4);
    const more = (m.people || []).length - people.length;
    host.innerHTML = people.map((p, i) =>
      `<div class="avatar ${p.editing ? "editing" : ""}" title="${String(p.name||"").replace(/"/g,"&quot;")}">${String((p.name||"?")[0]).toUpperCase()}</div>`
    ).join("") + (more > 0 ? `<div class="avatar more">+${more}</div>` : "");
  }

  // FDL 3-page onboarding (trap.md LOCKED 08-12): welcome+key / trust / try-it. Skip on every page.
  // Pure panel UI; the host (ForgePanel.cs) later sends { type:"firstrun" } and handles the key save via DPAPI.
  let onboarded = false;
  function showOnboard() {
    if (onboarded || localStorage.getItem("forge_onboarded")) return;
    onboarded = true;
    const o = document.createElement("div"); o.className = "onboard"; o.id = "onboard";
    let page = 1;
    const dots = () => `<div class="obdots">${[1,2,3].map(p=>`<div class="obdot ${p===page?"on":""}"></div>`).join("")}</div>`;
    const page1 = `<span class="obdiamond">◆</span><h1>Welcome to Forge</h1>
      <div class="obsub">Talk to SolidWorks in plain English. Get verified changes.</div>
      <input class="obkey" id="obkey" placeholder="Paste a provider key (optional) — or get a free one" />
      <button class="obpill" id="obnext">Continue</button>
      <button class="obghost obpill" id="obskip">Skip for now — I'll stay keyless</button>`;
    const page2 = `<span class="obdiamond">◆</span><h1>Your data stays yours</h1>
      <div class="obtrust">
        <div><span class="glyph2">✓</span>we never get your model geometry</div>
        <div><span class="glyph2">✓</span>no IP · no file names · no dimensions</div>
        <div><span class="glyph2">✓</span>your key never leaves your machine</div>
        <div><span class="glyph2">✓</span>off is off — nothing leaves</div>
      </div>
      <button class="obpill" id="obnext">Continue</button>`;
    const page3 = `<span class="obdiamond">◆</span><h1>Try it</h1>
      <div class="obsub">"make the bore 25mm"</div>
      <div class="obsub" style="color:var(--faint)">Forge reads, edits, and independently re-measures — it never claims a change it didn't verify.</div>
      <button class="obpill" id="obfinish">Start using Forge</button>`;
    const render = () => {
      o.innerHTML = `<button class="obskip" id="obskipall">Skip</button>${page===1?page1:page===2?page2:page3}${dots()}`;
      const nxt = o.querySelector("#obnext");
      if (nxt) nxt.addEventListener("click", () => {
        const k = o.querySelector("#obkey");
        if (k && k.value.trim()) post({ action: "saveKey", key: k.value.trim() });
        page++; render();
      });
      const fin = o.querySelector("#obfinish");
      if (fin) fin.addEventListener("click", done);
      const sk = o.querySelector("#obskip"), sa = o.querySelector("#obskipall");
      if (sk) sk.addEventListener("click", done);
      if (sa) sa.addEventListener("click", done);
      const k = o.querySelector("#obkey");
      if (k) k.addEventListener("keydown", (e) => { if (e.key === "Enter") { page++; render(); } });
    };
    const done = () => { localStorage.setItem("forge_onboarded","1"); o.remove(); intent.focus(); };
    render();
    transcript.appendChild(o);
  }
  // the host tells us it's a fresh run; until it does, the standalone preview still shows onboarding once
  if (!hasBridge && !localStorage.getItem("forge_onboarded")) showOnboard();

  if (hasBridge) window.chrome.webview.addEventListener("message", (e) => handle(JSON.parse(e.data)));

  function renderVariants(m) {
    const clean = m.variants.filter(v => v.success && v.healthy !== false).length;
    const review = m.variants.filter(v => v.success && v.healthy === false).length;
    let head = `Done — ${clean} ready${review ? `, ${review} need a look` : ""}${m.dimensionName ? " · " + m.dimensionName : ""}.`;
    let html = `<div class="done">${head}</div>`;
    if (m.description) html += `<div class="sub">${m.description.replace(/</g,"&lt;")}</div>`;
    html += m.variants.map(v => {
      if (!v.success) return `<div class="card fail"><div class="top"><span class="name">${v.label}</span><span class="tag">failed</span></div><div class="sub">${v.error || ""}</div></div>`;
      const drawing = v.drawingPath ? `<div class="sub">Drawing · ${v.drawingPath}</div>` : "";
      if (v.healthy === false) {
        return `<div class="card review">
          <div class="top"><span class="name">${v.label}</span><span class="tag">review</span></div>
          <div class="sub">Changed cleanly, but <b>${v.issue || "a feature"}</b> needs a quick look — the new size moved geometry it depended on.</div>
          <div class="sub">${v.path || ""}</div>${drawing}</div>`;
      }
      return `<div class="card ok">
        <div class="top"><span class="name">${v.label}</span><span class="tag">ready</span></div>
        <div class="sub">${v.path || ""}</div>${drawing}</div>`;
    }).join("");
    return html;
  }

  function renderEdit(m) {
    const what = (m.changed || []).join(", ");
    if (m.error) return `<div class="card fail"><div class="top"><span class="name">Couldn't apply</span></div><div class="sub">${(m.error||"").replace(/</g,"&lt;")}</div></div>`;
    if (m.reverted) return `<div class="card review">
      <div class="top"><span class="name">${what}</span><span class="tag">would break</span></div>
      <div class="sub">That would break <b>${m.issue||"a feature"}</b>, so I left your part unchanged. Reply <b>"do it anyway"</b> to force it, or ask me to fix ${m.issue||"it"}.</div></div>`;
    if (m.healthy === false) return `<div class="card review">
      <div class="top"><span class="name">${what}</span><span class="tag">review</span></div>
      <div class="sub">Saved a forced-edit copy — <b>${m.issue||"a feature"}</b> is broken in it. Your open part is untouched.${m.path?`<div class="sub" style="margin-top:4px">${m.path}</div>`:""}</div></div>`;
    return `<div class="card ok">
      <div class="top"><span class="name">${what}</span><span class="tag">done</span></div>
      <div class="sub">Saved an edited copy — nothing else broke, and your open part is untouched.${m.path?`<div class="sub" style="margin-top:4px">${m.path}</div>`:""}</div></div>`;
  }

  // ---- standalone browser preview: fakes the crew narration so the look can be checked without SolidWorks ----
  function demoRun(text) {
    const seq = [
      [500,  () => handle({type:"step", agent:"Gauge",    gloss:"reading the assembly"})],
      [1400, () => handle({type:"step", agent:"Gauge",    state:"done", result:"found 112 fasteners in 14 holes"})],
      [1500, () => handle({type:"step", agent:"Torque",   gloss:"mating the wheel bolts"})],
      [3600, () => handle({type:"step", agent:"Torque",   state:"done", result:"112 fasteners mated"})],
      [3700, () => handle({type:"step", agent:"Sentinel", gloss:"verifying the rebuild"})],
      [4600, () => handle({type:"step", agent:"Sentinel", state:"done", result:"rebuild clean, nothing broke"})],
      [4800, () => handle({type:"mated", count:112, failed:0, clean:true})],
    ];
    seq.forEach(([t, fn]) => setTimeout(fn, t));
  }
  if (!hasBridge) handle({ type:"model", title:"Wheel Hub Assembly (demo)", dimensions:new Array(22) });

  // ConfirmGate + ShareLink actions (delegated)
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-confirm]");
    if (go) {
      const gate = go.closest(".gate");
      post({ action: "confirm", accept: go.getAttribute("data-confirm") === "1" });
      if (gate) gate.innerHTML = `<div class="sub" style="color:var(--soft)">${go.getAttribute("data-confirm") === "1" ? "Running it…" : "Standing down — nothing changed."}</div>`;
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp) { const link = cp.closest(".share").querySelector(".link").textContent; try { navigator.clipboard.writeText(link); cp.textContent = "copied"; } catch {} return; }
    const rv = e.target.closest("[data-revoke]");
    if (rv) { post({ action: "revokeShare" }); rv.textContent = "revoked"; return; }
  });

  // per-run thumbs: tags feedback to the exact run trace (correction data)
  document.addEventListener("click", (e) => {
    const fb = e.target.closest(".fb"); if (!fb) return;
    const run = fb.getAttribute("data-run"), handler = fb.getAttribute("data-handler") || "";
    if (e.target.classList.contains("tup")) { post({ action:"feedback", runId:run, handler:handler, sentiment:1 }); fb.innerHTML = "<span class='fbthx2'>thanks</span>"; }
    else if (e.target.classList.contains("tdn")) { const r = fb.querySelector(".reasons"); if (r) r.style.display = "inline"; }
    else if (e.target.hasAttribute("data-r")) { post({ action:"feedback", runId:run, handler:handler, sentiment:0, reason:e.target.getAttribute("data-r") }); fb.innerHTML = "<span class='fbthx2'>thanks - noted</span>"; }
  });

  // attach affordance: hand Forge a file (the other version to compare, etc.) without typing a path
  function showChip(name) {
    const chip = $("chip");
    chip.innerHTML = `📎 ${(name||"file").replace(/</g,"&lt;")} <button class="x" id="chipx" title="remove">✕</button>`;
    chip.style.display = "inline-flex";
    $("chipx").addEventListener("click", () => post({ action: "clearAttach" }));
  }
  function hideChip() { const chip = $("chip"); chip.style.display = "none"; chip.innerHTML = ""; }
  $("attach").addEventListener("click", () => post({ action: "attach" }));

  // trial feedback
  function fbThanks() { $("fbthx").textContent = "thanks!"; }
  $("fbup").addEventListener("click", () => { post({ action:"feedback", sentiment:1 }); fbThanks(); });
  $("fbdown").addEventListener("click", () => { post({ action:"feedback", sentiment:0 }); fbThanks(); });
  $("fbtxt").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const t = $("fbtxt").value.trim(); if (t) { post({ action:"feedback", text:t }); $("fbtxt").value=""; fbThanks(); } }
  });
</script>
</body>
</html>

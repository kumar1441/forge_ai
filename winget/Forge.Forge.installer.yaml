# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Forge winget installer manifest — submit to microsoft/winget-pkgs once the first SIGNED MSI is
# released. Fill InstallerSha256 (SHA-256 of the MSI) and ProductCode (from the MSI) after release.
PackageIdentifier: Forge.Forge
PackageVersion: 0.1.0
InstallerType: wix
Scope: machine
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/kumar1441/forge_ai/releases/download/v0.1.0/Forge-Setup-0.1.0.msi
  InstallerSha256: <fill: SHA-256 of the released MSI>
  ProductCode: <fill: MSI ProductCode from installer/Product.wxs>
ManifestType: installer
ManifestVersion: 1.6.0
